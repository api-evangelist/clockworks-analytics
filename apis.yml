apis:
- name: Clockworks Base API
  description: The Base container of the Clockworks REST API. Serves static asset information
    — clients, buildings, building types and variables, equipment, equipment classes /
    types / variables, points, point classes and types, engineering units, task records
    and users — as JSON:API-shaped documents. Authenticated with an Azure API Management
    subscription key in the Ocp-Apim-Subscription-Key header.
  humanURL: https://cw.clockworksanalytics.com/APIDocumentation.aspx
  baseURL: https://rest.buildingsapi.net/core-base
  tags:
  - Buildings
  - Equipment
  - Assets
  properties:
  - type: Documentation
    url: https://cw.clockworksanalytics.com/APIDocumentation.aspx
  - type: APIReference
    url: https://cw.clockworksanalytics.com/APIDocumentation.aspx
- name: Clockworks Diagnostics API
  description: The core-diag container. POST /diagnostics returns the diagnostic records
    produced by the Clockworks analysis engine for a set of client IDs, building IDs, a
    date range and an analysis interval, including avoidable cost, energy / comfort /
    maintenance priorities and the narrative fault notes.
  humanURL: https://cw.clockworksanalytics.com/APIDocumentation.aspx
  baseURL: https://rest.buildingsapi.net/core-diag
  tags:
  - Diagnostics
  - Faults
- name: Clockworks Key Performance Indicators API
  description: The core-kpis container. POST /AggregatedData accepts a Kusto Query
    Language (KQL) expression plus a dataset list and returns server-side aggregated
    results across the Clockworks datasets (Diagnostics, DiagnosticResults, RawData,
    AggregatedRawData, Equipment, Buildings, Points, Tasks, Users and more) instead of
    thousands of individual records.
  humanURL: https://clockworksanalytics.atlassian.net/wiki/spaces/ClockworksAnalyticsUM/pages/4577951781/Key+Performance+Indicators+API+Developer+Guide
  baseURL: https://rest.buildingsapi.net/core-kpis
  tags:
  - KPIs
  - Analytics
  - Aggregation
  properties:
  - type: Documentation
    url: https://clockworksanalytics.atlassian.net/wiki/spaces/ClockworksAnalyticsUM/pages/4577951781/Key+Performance+Indicators+API+Developer+Guide
- name: Clockworks Work Orders API
  description: The workorders container. Carries the Task records Clockworks users create
    from diagnostic results and synchronizes them to work orders in a CMMS. Uses a bearer
    token obtained from POST /workorders/auth/token with a clientId and clientSecret,
    valid for 3599 seconds, rather than the subscription key used by the other containers.
  humanURL: https://clockworksanalytics.atlassian.net/wiki/spaces/ClockworksAnalyticsUM/pages/5742297089/CMMS+Integration+Developer+Guide+version+2
  baseURL: https://rest.buildingsapi.net/workorders
  tags:
  - Work Orders
  - Tasks
  - CMMS
  properties:
  - type: Documentation
    url: https://clockworksanalytics.atlassian.net/wiki/spaces/ClockworksAnalyticsUM/pages/5742297089/CMMS+Integration+Developer+Guide+version+2
  - type: GettingStarted
    url: https://clockworksanalytics.atlassian.net/wiki/spaces/ClockworksAnalyticsUM/pages/5742297089/CMMS+Integration+Developer+Guide+version+2
