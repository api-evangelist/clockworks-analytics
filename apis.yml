aid: clockworks-analytics
name: Clockworks Analytics
description: 'Clockworks Analytics is a Boston-area building-analytics company whose
  cloud platform performs automated fault detection and diagnostics (FDD) on HVAC and
  building systems. It ingests interval data from Building Management Systems through
  the Clockworks Connect gateway, runs a curated library of root-cause diagnostics, and
  quantifies each performance issue by avoidable energy cost plus energy, comfort and
  maintenance priority on a 0-10 scale. Its public REST API is delivered through Azure
  API Management on rest.buildingsapi.net as four containers — core-base (clients,
  buildings, equipment, points, users), core-diag (diagnostic records), core-kpis
  (KQL-driven aggregated datasets) and workorders (Tasks / CMMS work-order sync) — and
  is documented publicly at cw.clockworksanalytics.com plus a public Confluence developer
  guide set for CMMS and KPI integration.'
