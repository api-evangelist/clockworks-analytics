note: >-
  Derived from the relationship links and nested collection routes Clockworks publishes in
  its own REST API documentation, plus the dataset catalog in the KPI developer guide. No
  OpenAPI exists for this provider, so no $ref graph was available; every entity and edge
  below is stated in the provider's documentation.
identifiers:
  CID: client organization id
  BID: building id
  EID: equipment id
  TaskID: globally unique task id
  OrganizationTaskID: task id unique within a client organization
entities:
- name: Clients
  container: core-base
  description: A subscribing customer organization. An API subscriber may have many peer
    clients.
  key: id
  attributes:
  - ClientName
  - ClientAddress
  - ClientCity
  - ClientStateName
  - ClientZip
  - ClientPhone
  - IsActive
  - ReportTheme
  - OrganizationTheme
  - CountryName
  - ParentOrganization
- name: Buildings
  container: core-base
  description: A logical structural unit, either a single physical structure or several
    grouped by criteria.
  attributes:
  - BuildingName
  - BuildingTypeID
  - CID
  - Address
  - BuildingClassID
  - BuildingClassName
  - BuildingClassDescription
  - BuildingOwnership
- name: BuildingTypes
  container: core-base
- name: BuildingVariables
  container: core-base
  description: Static metadata about buildings such as utility rates and operating
    schedules.
- name: Equipment
  container: core-base
  description: A piece of building equipment analysed by Clockworks.
  attributes:
  - BID
  - BuildingName
  - EquipmentName
  - EquipmentLocation
  - SerialNumber
  - EquipmentTypeID
  - IsActive
  - IsVisible
  - ConfigurationStatusID
  - ConfigurationStatusName
  - ManufacturerModelID
  - CMMSReferenceID
  - CMMSLink
- name: EquipmentClasses
  container: core-base
- name: EquipmentTypes
  container: core-base
- name: EquipmentVariables
  container: core-base
  description: Static metadata about equipment such as rated fan power, rated flow and
    sequence details.
- name: Points
  container: core-base
  description: Raw data points collected from the Building Management System.
- name: PointClasses
  container: core-base
- name: PointTypes
  container: core-base
- name: EngineeringUnits
  container: core-base
- name: DataSources
  container: core-base
  description: The Clockworks Connect software gateway polling raw data from the BMS.
- name: BMSInfo
  container: core-base
  description: Building Management System details for a client.
- name: DataTransferServices
  container: core-base
- name: Analyses
  container: core-base
- name: TaskRecords
  container: core-base
- name: TaskStatuses
  container: core-base
- name: Users
  container: core-base
- name: Diagnostics
  container: core-diag
  description: Combined output of all diagnostic results produced by a single analysis on a
    piece of equipment, with avoidable cost and energy/comfort/maintenance priorities.
  attributes:
  - ID
  - AEID
  - AID
  - EID
  - BID
  - EquipmentClassId
  - EquipmentTypeId
  - StartDate
  - AnalysisName
  - EquipmentName
  - EnergyPriority
  - ComfortPriority
  - MaintenancePriority
  - TotalPriority
  - CostSavings
  - Notes
  - NotesSummary
  - DiagnosticHyperlink
- name: RawData
  container: core-base
  description: Typically 5-minute interval data collected from the BMS.
- name: VData
  container: core-base
  description: Calculated points produced by Clockworks on an hourly or daily timestamp.
- name: VPoints
  container: core-base
- name: Tasks
  container: workorders
  description: User-generated tasks created from diagnostic results and synchronized to CMMS
    work orders.
  attributes:
  - TaskID
  - OrganizationTaskID
  - BuildingID
  - BuildingName
  - OrganizationID
  - Summary
  - Description
